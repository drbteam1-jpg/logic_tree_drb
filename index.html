<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로직트리 편집기</title>
<style>
  :root{
    --navy-0:#1F3864;
    --navy-1:#2E5395;
    --blue-2:#BDD7EE;
    --gold:#C9A227;
    --bg:#F4F6FA;
    --line:#8B9BB4;
    --ink:#1B2430;
    --danger:#C0392B;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    overflow:hidden;
  }

  /* ---------- Toolbar ---------- */
  #toolbar{
    position:fixed; top:0; left:0; right:0; height:56px;
    background:var(--navy-0);
    display:flex; align-items:center; gap:8px;
    padding:0 16px;
    z-index:50;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  #toolbar h1{
    color:#fff; font-size:15px; font-weight:700; margin:0 16px 0 0;
    letter-spacing:.02em; white-space:nowrap;
  }
  .tbtn{
    appearance:none; border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.06); color:#fff;
    font-size:12.5px; padding:7px 12px; border-radius:6px;
    cursor:pointer; white-space:nowrap;
    transition:background .12s ease;
  }
  .tbtn:hover{ background:rgba(255,255,255,.18); }
  .tbtn.primary{ background:var(--gold); border-color:var(--gold); color:#1B2430; font-weight:700; }
  .tbtn.primary:hover{ filter:brightness(1.08); }
  .tbtn.danger{ border-color:rgba(255,120,110,.4); color:#FFD8D2; }
  .tbtn.danger:hover{ background:rgba(192,57,43,.35); }
  #fileInput{ display:none; }
  .spacer{ flex:1; }
  #hint{
    color:rgba(255,255,255,.55); font-size:11.5px; white-space:nowrap;
  }
  #connBadge{
    display:flex; align-items:center; gap:6px;
    font-size:11.5px; color:rgba(255,255,255,.85);
    padding:5px 10px; border-radius:12px;
    background:rgba(255,255,255,.08);
    white-space:nowrap;
  }
  #connDot{
    width:8px; height:8px; border-radius:50%;
    background:#888; flex:0 0 8px;
    box-shadow:0 0 0 rgba(0,0,0,0);
  }
  #connBadge.online #connDot{ background:#3FC97A; box-shadow:0 0 6px #3FC97A; }
  #connBadge.offline #connDot{ background:#E0554B; }
  #connBadge.standalone #connDot{ background:#D9A22C; }

  #standaloneBanner{
    position:fixed; top:94px; left:0; right:0; z-index:45;
    background:#FFF3CD; color:#5C4A12; font-size:12.5px;
    padding:8px 16px; text-align:center;
    border-bottom:1px solid #E7CE86;
    display:none;
  }
  #standaloneBanner code{
    background:#00000012; padding:1px 6px; border-radius:4px;
  }

  /* ---------- Sheet tabs ---------- */
  #sheetBar{
    position:fixed; top:56px; left:0; right:0; height:38px;
    background:#E7EBF3;
    border-bottom:1px solid #D3D9E5;
    display:flex; align-items:flex-end; gap:2px;
    padding:0 10px;
    z-index:49;
    overflow-x:auto;
  }
  .sheetTab{
    display:flex; align-items:center; gap:6px;
    background:#D3D9E5; color:#3C4658;
    font-size:12.5px; font-weight:600;
    padding:6px 12px 7px 14px;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    white-space:nowrap;
    border:1px solid #C3CBDC; border-bottom:none;
    user-select:none;
  }
  .sheetTab.active{
    background:#fff; color:var(--navy-0);
    box-shadow:0 -1px 3px rgba(0,0,0,.05);
  }
  .sheetTab .tabClose{
    width:15px; height:15px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; color:#8B95AA;
    opacity:0;
  }
  .sheetTab:hover .tabClose{ opacity:1; }
  .sheetTab .tabClose:hover{ background:var(--danger); color:#fff; }
  #addSheetBtn{
    display:flex; align-items:center; justify-content:center;
    width:26px; height:26px; margin-bottom:6px;
    border-radius:6px; border:1px dashed #A9B4C6;
    color:#5C6B85; font-size:15px; font-weight:700;
    cursor:pointer; background:transparent;
  }
  #addSheetBtn:hover{ background:#fff; }

  /* ---------- Canvas ---------- */
  #viewport{
    position:absolute; top:94px; left:0; right:0; bottom:0;
    overflow:auto;
    background-image: radial-gradient(circle, #DCE3EE 1px, transparent 1px);
    background-size: 22px 22px;
    cursor:grab;
  }
  #viewport.panning{ cursor:grabbing; }
  #canvas{
    position:relative;
    width:5000px; height:3400px;
  }
  svg#lines{
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none;
  }
  svg#lines path{
    fill:none; stroke:var(--line); stroke-width:2;
  }

  /* ---------- Node ---------- */
  .node{
    position:absolute;
    min-width:150px; max-width:280px;
    border-radius:9px;
    box-shadow:0 2px 6px rgba(20,30,50,.18);
    user-select:none;
    border:1px solid rgba(0,0,0,.08);
  }
  .node .body{
    display:flex; align-items:stretch;
  }
  .node .handle{
    flex:0 0 22px;
    display:flex; align-items:center; justify-content:center;
    cursor:grab;
    font-size:13px;
    color:rgba(255,255,255,.55);
    border-right:1px solid rgba(255,255,255,.12);
  }
  .node.depth-2 .handle, .node.depth-3 .handle{ color:rgba(0,0,0,.35); border-right:1px solid rgba(0,0,0,.08); }
  .node .handle:active{ cursor:grabbing; }

  .node .text{
    flex:1;
    padding:9px 10px;
    font-size:13px; line-height:1.4;
    outline:none;
    word-break:break-word;
    white-space:pre-wrap;
    min-height:1.4em;
  }
  .node .text:empty:before{
    content:"내용을 입력하세요";
    opacity:.45;
  }
  .node .text:focus{
    background:rgba(255,255,255,.12);
  }

  .node .toolbtn{
    position:absolute;
    width:20px; height:20px;
    border-radius:50%;
    border:none;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700;
    cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.3);
    opacity:0; transform:scale(.7);
    transition:opacity .12s ease, transform .12s ease;
  }
  .node:hover .toolbtn{ opacity:1; transform:scale(1); }

  .node .addBtn{
    right:-10px; bottom:-10px;
    background:var(--gold); color:#1B2430;
  }
  .node .delBtn{
    right:-10px; top:-10px;
    background:var(--danger); color:#fff;
  }
  .node .siblingBtn{
    left:-10px; bottom:-10px;
    background:#6B7A99; color:#fff;
    font-size:11px;
  }
  .node .selectBtn{
    left:-10px; top:-10px;
    background:#fff; color:#8B9BB4;
    border:2px solid #8B9BB4;
    font-size:11px;
  }
  .node.selected{
    outline:3px solid var(--gold);
    outline-offset:2px;
    box-shadow:0 0 0 5px rgba(201,162,39,.22), 0 2px 6px rgba(20,30,50,.18);
  }
  .node.selected .selectBtn{
    opacity:1; transform:scale(1);
    background:var(--gold); border-color:var(--gold); color:#1B2430;
  }

  #selectionBar{
    display:none; align-items:center; gap:6px;
    background:rgba(255,255,255,.08);
    padding:5px 10px; border-radius:8px;
  }
  #selCount{ color:#fff; font-size:12px; white-space:nowrap; margin-right:2px; }

  .node.dragging{ opacity:.85; box-shadow:0 8px 20px rgba(20,30,50,.35); z-index:40; }

  /* depth palette */
  .node.depth-0{ background:var(--navy-0); }
  .node.depth-0 .text{ color:#fff; font-weight:700; font-size:14px; }
  .node.depth-1{ background:var(--navy-1); }
  .node.depth-1 .text{ color:#fff; font-weight:600; }
  .node.depth-2{ background:var(--blue-2); }
  .node.depth-2 .text{ color:#122; }
  .node.depth-3{ background:#fff; border:1px solid #C7CFDD; }
  .node.depth-3 .text{ color:#1B2430; }
  .node.depth-4{ background:#fff; border:1px dashed #A9B4C6; }
  .node.depth-4 .text{ color:#3C4658; font-size:12.3px; }

  /* empty state */
  #emptyMsg{
    position:absolute; top:120px; left:60px;
    color:#8C97AB; font-size:13px; max-width:280px;
    pointer-events:none;
  }
</style>
</head>
<body>

<div id="toolbar">
  <h1>🌳 로직트리 편집기</h1>
  <button class="tbtn primary" id="addRootBtn">+ 대분류 추가</button>
  <button class="tbtn" id="arrangeBtn">자동 정렬</button>
  <button class="tbtn" id="exportBtn">내보내기 (JSON)</button>
  <button class="tbtn" id="importBtn">불러오기</button>
  <input type="file" id="fileInput" accept="application/json">
  <button class="tbtn danger" id="clearBtn">전체 삭제</button>
  <div id="selectionBar">
    <span id="selCount"></span>
    <button class="tbtn" id="groupBtn" title="선택한 노드들을 감싸는 새 상위 카테고리 생성">⬆ 상위 카테고리로 묶기</button>
    <button class="tbtn" id="alignXBtn" title="선택한 노드들을 같은 세로줄(X)로 맞춤">↕ 세로줄 맞춤</button>
    <button class="tbtn" id="alignYBtn" title="선택한 노드들을 같은 가로줄(Y)로 맞춤">↔ 가로줄 맞춤</button>
    <button class="tbtn" id="distributeYBtn" title="선택한 노드들을 세로 방향으로 균등 간격 배치">≡ 간격 균등</button>
    <button class="tbtn" id="clearSelBtn">선택 해제</button>
  </div>
  <div class="spacer"></div>
  <span id="hint">텍스트 클릭=수정 · 손잡이(⠿) 드래그=이동 · 좌측상단 원(◯) 클릭=다중선택 후 정렬 · 빈 배경 드래그=화면 이동</span>
  <div id="connBadge" class="standalone"><span id="connDot"></span><span id="connText">독립 실행 모드</span></div>
</div>

<div id="standaloneBanner">
  ⚠ Firebase가 설정되지 않아 <b>이 브라우저에서만</b> 보이는 독립 실행 모드입니다.
  실시간 공동편집을 쓰려면 HTML 파일 상단 &lt;script&gt;의 <code>firebaseConfig</code> 값을 채워주세요. (아래 안내 참고)
</div>

<div id="sheetBar"></div>

<div id="viewport">
  <div id="canvas">
    <svg id="lines"></svg>
    <div id="emptyMsg">아직 노드가 없습니다.<br>상단의 "대분류 추가" 버튼을 눌러 시작하세요.</div>
  </div>
</div>


<!-- =========================================================================
  Firebase 실시간 동기화 (선택사항)
  ---------------------------------------------------------------------------
  이 두 줄은 구글의 무료 Firebase SDK를 불러옵니다. 아래 firebaseConfig를
  채우지 않으면 이 파일은 그냥 "혼자 쓰는 모드"로 동작합니다 (기존과 동일).

  【설정 방법 - 5분】
  1) https://console.firebase.google.com 접속 → 구글 계정으로 로그인
  2) "프로젝트 추가" → 이름 입력 (예: logic-tree) → 애널리틱스는 꺼도 됨
  3) 왼쪽 메뉴 "빌드 > Realtime Database" → "데이터베이스 만들기"
     → 위치는 아무거나 → "테스트 모드에서 시작" 선택 (내부용이면 우선 OK)
  4) 톱니바퀴(프로젝트 설정) → 아래로 스크롤 → "앱 추가" → 웹(</>) 아이콘 클릭
     → 앱 닉네임 아무거나 입력 → "앱 등록"
  5) 화면에 나오는 firebaseConfig = {...} 객체를 통째로 복사해서
     아래 firebaseConfig 자리에 붙여넣기
  6) 파일 저장 → 이 파일을 팀원들에게 공유(이메일/공유폴더/GitHub 등 무엇이든)
     → 모두 같은 Firebase 프로젝트를 바라보므로 실시간으로 동기화됩니다.

  ※ "테스트 모드"는 누구나 읽고 쓸 수 있는 규칙입니다. 사내용으로 충분하지만,
     민감한 정보는 넣지 마시고, 필요하면 Firebase 콘솔의 Realtime Database
     > 규칙(Rules) 탭에서 접근 제한을 추가로 설정하실 수 있습니다.
========================================================================== -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
(function(){
  "use strict";

  // ▼▼▼ 여기에 본인의 Firebase 설정값을 붙여넣으세요 ▼▼▼
  const firebaseConfig = {
    apiKey: "AIzaSyDiF5eRI-2Sq2HZ8f7z2Jm23ck3LjgnL4U",
    authDomain: "paperless-drb.firebaseapp.com",
    databaseURL: "https://paperless-drb-default-rtdb.firebaseio.com",
    projectId: "paperless-drb",
    storageBucket: "paperless-drb.firebasestorage.app",
    messagingSenderId: "750540629158",
    appId: "1:750540629158:web:54b17a6b722425cfce8067"
  };
  // ▲▲▲ 여기까지 ▲▲▲

  // 같은 파일을 여러 "작업공간(room)"으로 나눠 쓰고 싶다면 URL 뒤에 ?room=이름 을 붙이세요.
  // 예: logic_tree_editor.html?room=압출팀   (안 붙이면 'default' 공용 작업공간 사용)
  // 작업공간 안에서 여러 "시트"(엑셀 탭과 동일 개념)를 만들 수 있습니다.
  const roomId = new URLSearchParams(location.search).get('room') || 'default';

  let firebaseReady = false;
  let db = null;
  let sheetsRef = null;      // 시트 목록(이름/순서) 참조
  let dataRef = null;        // 현재 선택된 시트의 노드 데이터 참조
  let sheets = {};           // sheetId -> {name, order}
  let currentSheetId = null;
  let editingId = null;   // 지금 텍스트를 입력 중인 노드 (원격 갱신으로부터 보호)
  let draggingId = null;  // 지금 드래그 중인 노드 (원격 갱신으로부터 보호)
  let saveTimer = null;

  function setConnBadge(state, text){
    const badge = document.getElementById('connBadge');
    const label = document.getElementById('connText');
    badge.className = state;
    label.textContent = text;
    document.getElementById('standaloneBanner').style.display =
      (state === 'standalone') ? 'block' : 'none';
  }

  function scheduleSave(delay){
    if(!firebaseReady) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, delay || 300);
  }

  function saveNow(){
    if(!firebaseReady || !dataRef) return;
    dataRef.set({ nodes: nodes, nextId: nextId }).catch(err => {
      console.error('Firebase 저장 실패:', err);
      setConnBadge('offline', '저장 실패 (연결 확인)');
    });
  }

  // ---------------- Sheets (엑셀 탭 방식) ----------------
  function renderTabs(){
    const bar = document.getElementById('sheetBar');
    bar.innerHTML = '';
    const list = Object.keys(sheets)
      .map(id => ({ id, ...sheets[id] }))
      .sort((a, b) => (a.order || 0) - (b.order || 0));

    list.forEach(s => {
      const tab = document.createElement('div');
      tab.className = 'sheetTab' + (s.id === currentSheetId ? ' active' : '');
      tab.innerHTML = '<span class="tabLabel"></span><span class="tabClose" title="시트 삭제">×</span>';
      tab.querySelector('.tabLabel').textContent = s.name || '(이름없음)';
      tab.addEventListener('click', (e) => {
        if(e.target.classList.contains('tabClose')) return;
        switchSheet(s.id);
      });
      tab.addEventListener('dblclick', (e) => {
        if(e.target.classList.contains('tabClose')) return;
        const newName = prompt('시트 이름 변경', s.name || '');
        if(newName && newName.trim()){
          sheetsRef.child(s.id).update({ name: newName.trim() });
        }
      });
      tab.querySelector('.tabClose').addEventListener('click', (e) => {
        e.stopPropagation();
        if(list.length <= 1){
          alert('마지막 남은 시트는 삭제할 수 없습니다.');
          return;
        }
        if(!confirm('"' + (s.name || '') + '" 시트를 삭제할까요? 되돌릴 수 없습니다.')) return;
        sheetsRef.child(s.id).remove();
        db.ref('logicTree/' + roomId + '/data/' + s.id).remove();
        if(s.id === currentSheetId){
          const remaining = list.filter(x => x.id !== s.id);
          if(remaining.length > 0) switchSheet(remaining[0].id);
        }
      });
      bar.appendChild(tab);
    });

    const addBtn = document.createElement('button');
    addBtn.id = 'addSheetBtn';
    addBtn.title = '새 시트 추가';
    addBtn.textContent = '+';
    addBtn.addEventListener('click', () => {
      const name = prompt('새 시트 이름', '시트' + (list.length + 1));
      if(name === null) return;
      createSheet(name.trim() || ('시트' + (list.length + 1)));
    });
    bar.appendChild(addBtn);
  }

  function createSheet(name){
    const id = 's' + Date.now() + Math.floor(Math.random() * 1000);
    const order = Object.keys(sheets).length;
    sheetsRef.child(id).set({ name, order }).then(() => {
      switchSheet(id);
    });
  }

  let pendingSeedSheetId = null;  // 새로 만든 빈 시트에 최초 1회 예시데이터를 넣기 위한 플래그

  function switchSheet(id){
    if(!sheets[id]) return;
    if(dataRef) dataRef.off();
    currentSheetId = id;
    nodes = {}; nextId = 1;
    selectedIds.clear();
    canvas.querySelectorAll('.node').forEach(el => el.remove());
    renderTabs();
    updateEmptyMsg();

    dataRef = db.ref('logicTree/' + roomId + '/data/' + id);
    let firstSnapshot = true;
    dataRef.on('value', (snap) => {
      const data = snap.val();
      if(firstSnapshot){
        firstSnapshot = false;
        if(id === pendingSeedSheetId && (!data || !data.nodes || Object.keys(data.nodes).length === 0)){
          pendingSeedSheetId = null;
          seedDemo();
          saveNow();
          return;
        }
        pendingSeedSheetId = null;
      }
      applyRemoteData(data ? data.nodes : {}, data ? data.nextId : 1);
    }, (err) => {
      console.error('시트 데이터 로드 오류:', err);
      setConnBadge('offline', '연결 오류');
    });
  }

  // ---------------- State ----------------
  let nodes = {};      // id -> {id, text, x, y, parentId, w, h}
  let nextId = 1;
  let selectedIds = new Set();   // 다중 선택된 노드 id (순서 보존)

  const canvas = document.getElementById('canvas');
  const linesSvg = document.getElementById('lines');
  const viewport = document.getElementById('viewport');
  const emptyMsg = document.getElementById('emptyMsg');

  function uid(){ return 'n' + (nextId++); }

  function depthOf(node){
    let d = 0, cur = node;
    const seen = new Set();
    while(cur.parentId && nodes[cur.parentId] && !seen.has(cur.id)){
      seen.add(cur.id);
      cur = nodes[cur.parentId];
      d++;
    }
    return d;
  }

  // ---------------- Node creation ----------------
  function createNode(text, x, y, parentId){
    const id = uid();
    nodes[id] = { id, text: text || '', x, y, parentId: parentId || null };
    renderNode(id);
    updateEmptyMsg();
    scheduleSave(150);
    return id;
  }

  function addRoot(){
    const count = Object.values(nodes).filter(n => !n.parentId).length;
    createNode('새 대분류', 60 + count * 40, 40 + count * 140, null);
    redrawLines();
  }

  function addChild(parentId){
    const parent = nodes[parentId];
    const siblingCount = Object.values(nodes).filter(n => n.parentId === parentId).length;
    const x = parent.x + 260;
    const y = parent.y + siblingCount * 76;
    createNode('새 항목', x, y, parentId);
    redrawLines();
  }

  function addSibling(nodeId){
    const n = nodes[nodeId];
    const x = n.x;
    const y = n.y + 76;
    createNode('새 항목', x, y, n.parentId);
    redrawLines();
  }

  function deleteNode(nodeId){
    const children = Object.values(nodes).filter(n => n.parentId === nodeId);
    if(children.length > 0){
      if(!confirm('하위 항목이 ' + children.length + '개 있습니다. 함께 삭제할까요?')) return;
    }
    // collect descendants
    const toDelete = [nodeId];
    let i = 0;
    while(i < toDelete.length){
      const cid = toDelete[i];
      Object.values(nodes).forEach(n => { if(n.parentId === cid) toDelete.push(n.id); });
      i++;
    }
    toDelete.forEach(id => {
      const el = document.getElementById('el-' + id);
      if(el) el.remove();
      delete nodes[id];
      selectedIds.delete(id);
    });
    updateEmptyMsg();
    redrawLines();
    saveNow();
  }

  // ---------------- Rendering ----------------
  function renderNode(id){
    const n = nodes[id];
    let el = document.getElementById('el-' + id);
    const isNew = !el;
    if(isNew){
      el = document.createElement('div');
      el.id = 'el-' + id;
      el.className = 'node';
      el.innerHTML =
        '<div class="body">' +
          '<div class="handle" title="드래그하여 이동">⠿</div>' +
          '<div class="text" contenteditable="true" spellcheck="false"></div>' +
        '</div>' +
        '<button class="toolbtn addBtn" title="하위 항목 추가">+</button>' +
        '<button class="toolbtn delBtn" title="삭제">×</button>' +
        '<button class="toolbtn siblingBtn" title="같은 레벨 항목 추가">↔</button>' +
        '<button class="toolbtn selectBtn" title="정렬을 위해 선택">◯</button>';
      canvas.appendChild(el);

      const textEl = el.querySelector('.text');
      textEl.addEventListener('focus', () => { editingId = id; });
      textEl.addEventListener('input', () => {
        nodes[id].text = textEl.innerText;
        scheduleSave(500);
      });
      textEl.addEventListener('blur', () => {
        if(editingId === id) editingId = null;
        redrawLines();
        saveNow();
      });
      textEl.addEventListener('pointerdown', e => e.stopPropagation());

      el.querySelector('.addBtn').addEventListener('click', (e) => {
        e.stopPropagation(); addChild(id);
      });
      el.querySelector('.delBtn').addEventListener('click', (e) => {
        e.stopPropagation(); deleteNode(id);
      });
      el.querySelector('.siblingBtn').addEventListener('click', (e) => {
        e.stopPropagation(); addSibling(id);
      });
      el.querySelector('.selectBtn').addEventListener('click', (e) => {
        e.stopPropagation(); toggleSelect(id);
      });

      makeDraggable(el, id);
    }

    const textEl = el.querySelector('.text');
    if(document.activeElement !== textEl){
      textEl.innerText = n.text;
    }
    el.className = 'node depth-' + Math.min(depthOf(n), 4);
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
  }

  function renderAll(){
    canvas.querySelectorAll('.node').forEach(el => el.remove());
    Object.keys(nodes).forEach(renderNode);
    redrawLines();
    updateEmptyMsg();
  }

  function updateEmptyMsg(){
    emptyMsg.style.display = Object.keys(nodes).length === 0 ? 'block' : 'none';
  }

  // ---------------- Multi-select & alignment ----------------
  function toggleSelect(id){
    if(selectedIds.has(id)){
      selectedIds.delete(id);
    } else {
      selectedIds.add(id);
    }
    updateSelectionVisual();
  }

  function updateSelectionVisual(){
    document.querySelectorAll('.node').forEach(el => el.classList.remove('selected'));
    selectedIds.forEach(id => {
      const el = document.getElementById('el-' + id);
      if(el) el.classList.add('selected');
    });
    const bar = document.getElementById('selectionBar');
    const countEl = document.getElementById('selCount');
    if(selectedIds.size > 0){
      bar.style.display = 'flex';
      countEl.textContent = selectedIds.size + '개 선택됨';
    } else {
      bar.style.display = 'none';
    }
    const needTwo = selectedIds.size >= 2;
    document.getElementById('alignXBtn').disabled = !needTwo;
    document.getElementById('alignYBtn').disabled = !needTwo;
    document.getElementById('distributeYBtn').disabled = selectedIds.size < 3;
  }

  function clearSelection(){
    selectedIds.clear();
    updateSelectionVisual();
  }

  // 선택한 노드들을 감싸는 새로운 상위 카테고리 노드를 생성 (대분류 위에 더 큰 분류 추가)
  function groupSelectedUnderNewParent(){
    const ids = [...selectedIds];
    if(ids.length < 1) return;
    const refParent = nodes[ids[0]].parentId;   // 첫 선택 노드의 기존 부모 자리를 새 노드가 대신 차지
    const minX = Math.min(...ids.map(id => nodes[id].x));
    const avgY = ids.reduce((s, id) => s + nodes[id].y, 0) / ids.length;
    const newId = createNode('새 상위 카테고리', Math.max(0, minX - 260), avgY, refParent);
    ids.forEach(id => { nodes[id].parentId = newId; renderNode(id); });
    clearSelection();
    redrawLines();
    saveNow();
  }

  // 선택한 노드들을 "첫 번째로 선택한 노드"의 X좌표에 맞춰 세로로 일직선 정렬
  function alignSelectedX(){
    const ids = [...selectedIds];
    if(ids.length < 2) return;
    const refX = nodes[ids[0]].x;
    ids.forEach(id => { nodes[id].x = refX; renderNode(id); });
    redrawLines();
    saveNow();
  }

  // 선택한 노드들을 "첫 번째로 선택한 노드"의 Y좌표에 맞춰 가로로 일직선 정렬
  function alignSelectedY(){
    const ids = [...selectedIds];
    if(ids.length < 2) return;
    const refY = nodes[ids[0]].y;
    ids.forEach(id => { nodes[id].y = refY; renderNode(id); });
    redrawLines();
    saveNow();
  }

  // 선택한 노드들을 Y좌표 기준 세로로 균등한 간격이 되도록 재배치 (X는 유지)
  function distributeSelectedY(){
    const ids = [...selectedIds];
    if(ids.length < 3) return;
    const sorted = ids.slice().sort((a, b) => nodes[a].y - nodes[b].y);
    const top = nodes[sorted[0]].y;
    const bottom = nodes[sorted[sorted.length - 1]].y;
    const step = (bottom - top) / (sorted.length - 1);
    sorted.forEach((id, i) => { nodes[id].y = top + step * i; renderNode(id); });
    redrawLines();
    saveNow();
  }

  // ---------------- Connector lines ----------------
  function redrawLines(){
    const svgns = 'http://www.w3.org/2000/svg';
    linesSvg.innerHTML = '';
    Object.values(nodes).forEach(n => {
      if(!n.parentId || !nodes[n.parentId]) return;
      const parentEl = document.getElementById('el-' + n.parentId);
      const childEl = document.getElementById('el-' + n.id);
      if(!parentEl || !childEl) return;

      const pRect = { x: n_x(parentEl), y: n_y(parentEl), w: parentEl.offsetWidth, h: parentEl.offsetHeight };
      const cRect = { x: n_x(childEl), y: n_y(childEl), w: childEl.offsetWidth, h: childEl.offsetHeight };

      const startX = pRect.x + pRect.w;
      const startY = pRect.y + pRect.h / 2;
      const endX = cRect.x;
      const endY = cRect.y + cRect.h / 2;
      const midX = startX + Math.max(28, (endX - startX) / 2);

      const path = document.createElementNS(svgns, 'path');
      const d = `M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${endY}, ${endX} ${endY}`;
      path.setAttribute('d', d);
      linesSvg.appendChild(path);
    });
  }
  function n_x(el){ return parseFloat(el.style.left) || 0; }
  function n_y(el){ return parseFloat(el.style.top) || 0; }

  // ---------------- Dragging nodes ----------------
  function makeDraggable(el, id){
    const handle = el.querySelector('.handle');
    let startPX, startPY, startNX, startNY, dragging = false;

    handle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      dragging = true;
      draggingId = id;
      el.classList.add('dragging');
      startPX = e.clientX; startPY = e.clientY;
      startNX = nodes[id].x; startNY = nodes[id].y;
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      const dx = e.clientX - startPX;
      const dy = e.clientY - startPY;
      nodes[id].x = Math.max(0, startNX + dx);
      nodes[id].y = Math.max(0, startNY + dy);
      el.style.left = nodes[id].x + 'px';
      el.style.top = nodes[id].y + 'px';
      redrawLines();
      scheduleSave(250);
    });
    function endDrag(e){
      if(!dragging) return;
      dragging = false;
      if(draggingId === id) draggingId = null;
      el.classList.remove('dragging');
      saveNow();
    }
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);
  }

  // ---------------- Canvas panning ----------------
  (function enablePan(){
    let panning = false, startX, startY, startLeft, startTop;
    viewport.addEventListener('pointerdown', (e) => {
      if(e.target !== viewport && e.target !== canvas && e.target.id !== 'lines' && e.target.id !== 'emptyMsg') return;
      panning = true;
      viewport.classList.add('panning');
      startX = e.clientX; startY = e.clientY;
      startLeft = viewport.scrollLeft; startTop = viewport.scrollTop;
    });
    window.addEventListener('pointermove', (e) => {
      if(!panning) return;
      viewport.scrollLeft = startLeft - (e.clientX - startX);
      viewport.scrollTop = startTop - (e.clientY - startY);
    });
    window.addEventListener('pointerup', () => {
      panning = false;
      viewport.classList.remove('panning');
    });
  })();

  // ---------------- Auto arrange (tidy tree layout) ----------------
  function autoArrange(){
    const roots = Object.values(nodes).filter(n => !n.parentId);
    const COL_W = 260, ROW_H = 76;
    let cursorRow = 0;

    function layout(nodeId, depth){
      const children = Object.values(nodes).filter(n => n.parentId === nodeId);
      if(children.length === 0){
        const row = cursorRow;
        nodes[nodeId].x = 40 + depth * COL_W;
        nodes[nodeId].y = 30 + row * ROW_H;
        cursorRow++;
        return row;
      }
      const childRows = children.map(c => layout(c.id, depth + 1));
      const avg = childRows.reduce((a,b) => a+b, 0) / childRows.length;
      nodes[nodeId].x = 40 + depth * COL_W;
      nodes[nodeId].y = 30 + avg * ROW_H;
      return avg;
    }

    roots.forEach(r => layout(r.id, 0));
    Object.keys(nodes).forEach(renderNode);
    redrawLines();
    saveNow();
  }

  // ---------------- Remote data merge (Firebase) ----------------
  function applyRemoteData(remoteNodes, remoteNextId){
    remoteNodes = remoteNodes || {};

    // remove local nodes that no longer exist remotely
    Object.keys(nodes).forEach(id => {
      if(!remoteNodes[id] && id !== editingId && id !== draggingId){
        const el = document.getElementById('el-' + id);
        if(el) el.remove();
        delete nodes[id];
        selectedIds.delete(id);
      }
    });

    // add / update from remote, protecting in-progress local edits
    Object.keys(remoteNodes).forEach(id => {
      const r = remoteNodes[id];
      const local = nodes[id];
      if(id === editingId){
        // keep local text (user is typing), accept structural fields only
        nodes[id] = { id, text: local ? local.text : r.text, x: r.x, y: r.y, parentId: r.parentId };
      } else if(id === draggingId){
        // keep local position (user is dragging), accept text
        nodes[id] = { id, text: r.text, x: local ? local.x : r.x, y: local ? local.y : r.y, parentId: r.parentId };
      } else {
        nodes[id] = { id, text: r.text, x: r.x, y: r.y, parentId: r.parentId };
      }
    });

    nextId = Math.max(nextId, remoteNextId || 1);
    Object.keys(nodes).forEach(renderNode);
    redrawLines();
    updateEmptyMsg();
  }

  // ---------------- Export / Import ----------------
  function exportJson(){
    const data = { nodes, nextId };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'logic_tree.json';
    a.click();
  }

  function importJson(file){
    if(firebaseReady && !confirm('불러온 내용으로 현재 공유 문서를 덮어씁니다. 계속할까요?')) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const data = JSON.parse(e.target.result);
        nodes = data.nodes || {};
        nextId = data.nextId || (Object.keys(nodes).length + 1);
        renderAll();
        saveNow();
      }catch(err){
        alert('파일을 읽을 수 없습니다: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  // ---------------- Toolbar wiring ----------------
  document.getElementById('addRootBtn').addEventListener('click', addRoot);
  document.getElementById('arrangeBtn').addEventListener('click', autoArrange);
  document.getElementById('exportBtn').addEventListener('click', exportJson);
  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change', (e) => {
    if(e.target.files[0]) importJson(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    if(Object.keys(nodes).length === 0) return;
    if(confirm('모든 노드를 삭제할까요? 이 작업은 되돌릴 수 없습니다.')){
      nodes = {}; nextId = 1;
      selectedIds.clear();
      renderAll();
      saveNow();
    }
  });
  document.getElementById('alignXBtn').addEventListener('click', alignSelectedX);
  document.getElementById('alignYBtn').addEventListener('click', alignSelectedY);
  document.getElementById('distributeYBtn').addEventListener('click', distributeSelectedY);
  document.getElementById('clearSelBtn').addEventListener('click', clearSelection);
  document.getElementById('groupBtn').addEventListener('click', groupSelectedUnderNewParent);

  window.addEventListener('resize', redrawLines);

  // ---------------- Seed data (used only when nothing exists yet) ----------------
  function seedDemo(){
    const r1 = createNode('1. 설비 신호 수집 및 디지털트윈 시스템 구축', 60, 40, null);
    createNode('1.1 설비 신호 수집 List 작성 (완료)', 320, 20, r1);
    createNode('1.2 생산설비 계장 작업 (견적 진행중)', 320, 96, r1);
    createNode('1.3 PLC ↔ 서버 통신 구축 (견적완료)', 320, 172, r1);
    createNode('1.4 디지털트윈 시스템 제작 (견적완료)', 320, 248, r1);

    const r2 = createNode('2. 빅데이터 연계 및 활용', 60, 360, null);
    createNode('2.1 불량 데이터 연계 분석', 320, 340, r2);
    createNode('2.2 설비 문제(고장) 데이터 연계 분석', 320, 416, r2);

    const r3 = createNode('3. 현장 작업자 단말기 시스템 (Phase 2)', 60, 540, null);
    createNode('3.1 단말기 지급 및 인프라 구축', 320, 500, r3);
    createNode('3.2 압출조건관리일지 전산입력', 320, 576, r3);
    createNode('3.3 일상점검표 전산입력', 320, 652, r3);
    createNode('3.4 입력데이터 시스템 누적관리', 320, 728, r3);

    redrawLines();
  }

  // ---------------- Firebase init ----------------
  function initFirebase(){
    const notConfigured = !firebaseConfig || firebaseConfig.apiKey === "YOUR_API_KEY_HERE";
    if(notConfigured){
      setConnBadge('standalone', '독립 실행 모드 (Firebase 미설정)');
      document.getElementById('sheetBar').style.display = 'none';
      document.getElementById('viewport').style.top = '56px';
      document.getElementById('standaloneBanner').style.top = '56px';
      seedDemo();
      return;
    }
    try{
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      sheetsRef = db.ref('logicTree/' + roomId + '/sheets');

      db.ref('.info/connected').on('value', (snap) => {
        if(snap.val() === true){
          setConnBadge('online', '실시간 연결됨 · 방: ' + roomId);
        } else if(firebaseReady){
          setConnBadge('offline', '연결 끊김 (재접속 시도 중)');
        }
      });

      // 1회성으로 시트 목록을 확인해서, 없으면 부트스트랩(마이그레이션 또는 예시데이터 생성)
      sheetsRef.once('value').then((snap) => {
        const existing = snap.val();
        if(existing && Object.keys(existing).length > 0){
          firebaseReady = true;
          attachSheetsListener();
          return;
        }
        // 시트가 하나도 없음 → 예전 방식(단일 시트) 데이터가 있는지 확인 후 마이그레이션
        return db.ref('logicTree/' + roomId + '/nodes').once('value').then((legacySnap) => {
          const legacyNodes = legacySnap.val();
          const firstId = 's' + Date.now();
          if(legacyNodes && Object.keys(legacyNodes).length > 0){
            return db.ref('logicTree/' + roomId + '/nextId').once('value').then((nextSnap) => {
              return db.ref('logicTree/' + roomId + '/data/' + firstId).set({
                nodes: legacyNodes, nextId: nextSnap.val() || 1
              }).then(() => sheetsRef.child(firstId).set({ name: 'Sheet1', order: 0 }));
            });
          } else {
            pendingSeedSheetId = firstId;
            return sheetsRef.child(firstId).set({ name: 'Sheet1', order: 0 });
          }
        }).then(() => {
          firebaseReady = true;
          attachSheetsListener();
        });
      }).catch((err) => {
        console.error('Firebase 부트스트랩 오류:', err);
        setConnBadge('offline', '초기화 오류 (설정을 확인하세요)');
      });
    }catch(e){
      console.error('Firebase 초기화 실패:', e);
      setConnBadge('offline', '초기화 실패 (설정을 확인하세요)');
      seedDemo();
    }
  }

  function attachSheetsListener(){
    sheetsRef.on('value', (snap) => {
      sheets = snap.val() || {};
      const ids = Object.keys(sheets);
      if(ids.length === 0) return;
      if(!currentSheetId || !sheets[currentSheetId]){
        const sorted = ids.map(id => ({ id, ...sheets[id] })).sort((a,b) => (a.order||0)-(b.order||0));
        switchSheet(sorted[0].id);
      } else {
        renderTabs();
      }
    }, (err) => {
      console.error('시트 목록 오류:', err);
      setConnBadge('offline', '연결 오류 (설정을 확인하세요)');
    });
  }

  initFirebase();

})();
</script>
